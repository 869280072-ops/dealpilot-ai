name: DealPilot verification
on:
  pull_request:
  push:
    branches: [main, security/p0-baseline, feature/p1-ai-quotation]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16.4-alpine
        env:
          POSTGRES_USER: p1_test
          POSTGRES_PASSWORD: synthetic-ci-only
          POSTGRES_DB: dealpilot_p1_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U p1_test -d dealpilot_p1_test_ci"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_SECRET: ci-only-synthetic-secret-at-least-thirty-two-bytes
      POSTGRES_URL: postgres://unused@127.0.0.1:1/unused
      LEGACY_STRIPE_ENABLED: 'false'
      DEALPILOT_AI_MODE: demo
      P1_TEST_DATABASE_URL: postgres://p1_test:synthetic-ci-only@127.0.0.1:5432/dealpilot_p1_test_ci
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9.15.9
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm lint
      - run: pnpm build
      - run: pnpm typecheck
      - run: pnpm audit --prod
